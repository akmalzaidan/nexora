# NEXORA API - production PHP overrides.
#
# The container image is immutable: code only changes when a new image is
# deployed, so opcache timestamp validation is disabled. The free Render tier
# has 512 MB of RAM, so opcache memory is deliberately capped.

memory_limit = 256M

; The API accepts JSON only and must never advertise the PHP version.
expose_php = Off

max_execution_time = 30
post_max_size = 8M
upload_max_filesize = 8M

; opcache
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 96
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 8000
opcache.validate_timestamps = 0
opcache.save_comments = 1
