# NEXORA API - production Apache configuration.
#
# Replaces the stock `000-default` site. The document root is `public/`, so
# application code, `.env` and `storage/` are never web reachable. `.htaccess`
# is disabled: the rewrite rules live here instead, which avoids a per-request
# AllowOverride lookup.
#
# These are deliberately SERVER-level directives, not wrapped in a
# `<VirtualHost *:80>` block. The listen port is rewritten to $PORT at container
# start, and a vhost pinned to a hard-coded port stops matching as soon as that
# port differs: requests silently fall through to Apache's main server config,
# which serves /var/www/html and 404s or 403s every route. With a single site
# there is nothing for a vhost to distinguish, so staying port-agnostic removes
# that failure mode entirely.
#
# ServerName is set so Apache stops warning that it cannot determine the fully
# qualified domain name.
ServerName localhost

DocumentRoot /var/www/html/public

<Directory /var/www/html/public>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>

# Laravel front controller. Real files and directories are served as-is;
# everything else is handed to index.php so the API keeps responding from
# any path.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ index.php [QSA,L]
</IfModule>

# The API returns JSON only, so there is nothing to frame or sniff.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header unset X-Powered-By
</IfModule>

ErrorLog ${APACHE_LOG_DIR}/error.log
CustomLog ${APACHE_LOG_DIR}/access.log combined
