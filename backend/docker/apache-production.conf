# NEXORA API - production Apache site.
#
# Replaces the stock `000-default` site. The document root is `public/`, so
# application code, `.env` and `storage/` are never web reachable. `.htaccess`
# is disabled: the rewrite rules live here instead, which avoids a per-request
# AllowOverride lookup.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # Laravel front controller. Real files and directories are served as-is;
    # everything else is handed to index.php so the API keeps responding from
    # any path.
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </IfModule>

    # The API returns JSON only, so there is nothing to frame or sniff.
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set Referrer-Policy "no-referrer"
        Header unset X-Powered-By
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
